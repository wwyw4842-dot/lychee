<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Lychee</title>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-csfDqtbFVcri5DO92o0WPa8GfDHPDiYA5/b/otEN1t4='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https: http: lychee-image:; font-src 'self' data:; connect-src 'self'; frame-src https://www.youtube-nocookie.com https://www.youtube.com; object-src 'none'; base-uri 'none'" />
    <script>
      (function() {
        var mode = localStorage.getItem('lychee-theme') || 'light';
        var dark = mode === 'dark' ||
          (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
